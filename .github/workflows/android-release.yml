name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "Building Still Launcher v${VERSION_NAME} (code ${VERSION_CODE})..."
          gradle assembleRelease -PversionCode=${VERSION_CODE} -PversionName=${VERSION_NAME} --no-daemon

      - name: Stage Release APK Asset
        run: |
          APK_FILE="Still-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          echo "APK_FILE=${APK_FILE}" >> $GITHUB_ENV
          ls -lh "${APK_FILE}"

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Still — Minimal Launcher v1.0.${{ github.run_number }} (Build #${{ github.run_number }})"
          files: "${{ env.APK_FILE }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
